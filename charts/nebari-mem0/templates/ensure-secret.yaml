{{- /*
The admin API key: the existingSecret you name, or a Secret this Job creates
once with random bytes and never changes. It is made in the cluster, not in the
chart: Argo CD renders charts with helm template, where reading live cluster state finds nothing,
so a value made in the chart would change on every sync.

Ordinary resources, not a pre-install hook: hooks run before the release's
other resources, so in a namespace the pack creates a hook would run before
that namespace exists. Until the Job has made the Secret, the pod that reads it
waits in CreateContainerConfigError, which Kubernetes retries. A Job's pod
template can't be changed, so the name carries a hash of the rendered pod: any
change to it makes a new Job in place of the old one.
*/ -}}
{{- /* Capped so the Job name, which adds "-" and 10 hex characters, stays within 63. */ -}}
{{- define "nebari-mem0.ensureSecretName" -}}
{{- printf "%s-ensure-secret" (include "nebari-mem0.fullname" . | trunc 38 | trimSuffix "-") -}}
{{- end -}}

{{- define "nebari-mem0.ensureSecretPod" }}
metadata:
  labels:
    {{- include "nebari-mem0.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ensure-secret
spec:
  serviceAccountName: {{ include "nebari-mem0.ensureSecretName" . }}
  automountServiceAccountToken: true
  restartPolicy: Never
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ensure-secret
      image: {{ include "nebari-mem0.toolsImage" . | quote }}
      imagePullPolicy: {{ .Values.tools.image.pullPolicy }}
      args: [ensure-secret, "-name", {{ include "nebari-mem0.adminKeySecret" . | quote }}, "-key", api-key]
      securityContext:
        {{- include "nebari-mem0.containerSecurityContext" 65532 | nindent 8 }}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
{{- end }}
{{- if not .Values.adminKey.existingSecret }}
{{- $name := include "nebari-mem0.ensureSecretName" . }}
{{- $pod := include "nebari-mem0.ensureSecretPod" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-mem0.labels" . | nindent 4 }}
---
# Create only: the Job can't read, change or delete any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-mem0.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-mem0.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name ($pod | sha256sum | trunc 10) }}
  labels:
    {{- include "nebari-mem0.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    {{- $pod | nindent 4 }}
{{- end }}
