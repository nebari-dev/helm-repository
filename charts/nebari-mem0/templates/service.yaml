apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebari-mem0.fullname" . }}
  labels:
    {{- include "nebari-mem0.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nebari-mem0.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
