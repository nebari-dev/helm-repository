suite: ensure-secret
templates:
  - templates/ensure-secret.yaml
release: {name: r}
tests:
  - it: renders a ServiceAccount, Role, RoleBinding and Job
    values: [required-values.yaml]
    asserts:
      - hasDocuments: {count: 4}
      - isKind: {of: ServiceAccount}
        documentIndex: 0
      - isKind: {of: Role}
        documentIndex: 1
      - isKind: {of: RoleBinding}
        documentIndex: 2
      - isKind: {of: Job}
        documentIndex: 3

  - it: gives the Job a create-only Role
    values: [required-values.yaml]
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [secrets], verbs: [create]}

  - it: binds the Role to the Job's ServiceAccount
    values: [required-values.yaml]
    documentIndex: 2
    asserts:
      - equal: {path: roleRef.name, value: r-nebari-mem0-ensure-secret}
      - equal: {path: "subjects[0].name", value: r-nebari-mem0-ensure-secret}

  - it: names the Job with a ten character hash of its pod
    values: [required-values.yaml]
    documentIndex: 3
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^r-nebari-mem0-ensure-secret-[0-9a-f]{10}$

  - it: runs ensure-secret for the admin key
    values: [required-values.yaml]
    documentIndex: 3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: [ensure-secret, "-name", mem0-admin-key, "-key", api-key]
      - equal: {path: "spec.template.spec.containers[0].image", value: "repo/tools:1.2.3"}
      - equal: {path: spec.backoffLimit, value: 3}
      - equal: {path: spec.template.spec.restartPolicy, value: Never}
      - equal: {path: spec.template.spec.enableServiceLinks, value: false}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: true}

  - it: uses the restricted security context
    values: [required-values.yaml]
    documentIndex: 3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}

  - it: is not a hook
    values: [required-values.yaml]
    asserts:
      - notExists: {path: 'metadata.annotations["helm.sh/hook"]'}
        documentIndex: 3
      - notExists: {path: 'metadata.annotations["argocd.argoproj.io/hook"]'}
        documentIndex: 3
      - notExists: {path: metadata.annotations}
        documentIndex: 3

  - it: renders nothing when the admin key Secret is supplied
    values: [required-values.yaml]
    set: {adminKey: {existingSecret: mine}}
    asserts:
      - hasDocuments: {count: 0}

  - it: keeps the Job name within 63 characters for a long release name
    release: {name: a-very-long-release-name-for-the-mem0-pack-install}
    values: [required-values.yaml]
    documentIndex: 3
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,63}$
      - matchRegex:
          path: metadata.name
          pattern: -[0-9a-f]{10}$
