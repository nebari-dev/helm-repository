# pack-testbed - CI TEST FIXTURE. Not for production use.

image:
  repository: ghcr.io/nebari-dev/pack-testbed/app
  tag: "sha-8880c17"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# DANGER: enables the app's raw header-echo debug mode (TESTBED_UNSAFE_ECHO=1).
# Set to true ONLY in ephemeral test clusters. Never on a shared/production cluster.
unsafeEcho: false

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# =============================================================================
# Nebari Integration (NebariApp CRD)
# =============================================================================
nebariapp:
  enabled: false
  # hostname: pack-testbed.nebari.example.com   # Required when enabled
  service:
    name: ""   # Defaults to release fullname
    port: 80
  routing:
    routes:
    - pathPrefix: /
      pathType: PathPrefix
    publicRoutes:
    - pathPrefix: /healthz
      pathType: Exact
    tls:
      enabled: true
  auth:
    enabled: false
    provider: keycloak
    provisionClient: true
    # forwardAccessToken: true   # set for the functional tier's token-forwarding assertions
    scopes:
    - openid
    - profile
    - email
  gateway: public

nameOverride: ""
fullnameOverride: ""
