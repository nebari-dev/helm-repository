apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pack-testbed.fullname" . }}
  labels:
    {{- include "pack-testbed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pack-testbed.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pack-testbed.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- if .Values.unsafeEcho }}
            # TEST-ONLY: enables raw header echo. Never set on a shared cluster.
            - name: TESTBED_UNSAFE_ECHO
              value: "1"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
