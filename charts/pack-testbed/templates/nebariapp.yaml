{{- if .Values.nebariapp.enabled }}
apiVersion: reconcilers.nebari.dev/v1
kind: NebariApp
metadata:
  name: {{ include "pack-testbed.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pack-testbed.labels" . | nindent 4 }}
spec:
  hostname: {{ required "nebariapp.hostname is required when nebariapp.enabled=true" .Values.nebariapp.hostname }}
  service:
    name: {{ .Values.nebariapp.service.name | default (include "pack-testbed.fullname" .) }}
    port: {{ .Values.nebariapp.service.port | default .Values.service.port }}
  {{- with .Values.nebariapp.routing }}
  routing:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nebariapp.auth }}
  auth:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  gateway: {{ .Values.nebariapp.gateway | default "public" }}
{{- end }}
